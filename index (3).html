<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review PAK Term 1 — Hamartia & The Old Me</title>
<style>
:root{--b:#1588df;--n:#173d68;--y:#ffd84b;--g:#4dbb70;--r:#ee6267;--p:#8b6bd0}
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(#8ed8ff,#eefaff 45%,#fff5ce);color:var(--n);min-height:100vh}.w{max-width:980px;margin:auto;padding:22px 13px 50px}.box{background:#fff;border-radius:26px;padding:24px;margin:17px 0;box-shadow:0 12px 30px #17466e22;border:4px solid #ffffffcc}.hero{text-align:center}.hero h1{font-size:clamp(31px,6vw,57px);margin:8px}.orange{color:#f29b20}.blue{color:#1d9be2}.tag,.type{display:inline-block;padding:7px 13px;border-radius:30px;font-weight:900}.tag{background:var(--y)}.type{background:#eaf7ff;color:#126da7;font-size:13px}input,textarea{width:100%;padding:13px;border:2px solid #cce6f6;border-radius:13px;font:inherit}textarea{min-height:125px}.student{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:700px;margin:auto}button{border:0;border-radius:14px;padding:12px 18px;font-weight:900;font-size:15px;cursor:pointer;background:var(--b);color:#fff;box-shadow:0 4px 0 #0d65a6}.secondary{background:var(--y);color:#604900;box-shadow:0 4px 0 #c6a41b}.green{background:var(--g);box-shadow:0 4px 0 #278b48}.hidden{display:none!important}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.prog{height:15px;background:#dceefa;border-radius:20px;overflow:hidden;flex:1}.prog div{height:100%;background:linear-gradient(90deg,var(--y),var(--g));transition:.3s}.q{font-size:21px;font-weight:900;line-height:1.45;margin:18px 0}.opts{display:grid;gap:10px}.opt{display:flex;gap:10px;align-items:flex-start;padding:13px;border:2px solid #d8ebf7;border-radius:14px;background:#fbfdff;cursor:pointer}.opt:hover{background:#eef9ff}.opt input{width:auto;margin-top:3px}.actions{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:20px}.hint{background:#fff7d9;border-left:6px solid #f1b91f;padding:11px;border-radius:10px;margin:12px 0}.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mrow{padding:12px;border:2px solid #deedf7;border-radius:14px;background:#fbfdff}.mrow select{width:100%;padding:10px;border:2px solid #cce6f6;border-radius:10px;margin-top:7px}.statement{padding:11px;border-bottom:1px solid #dfeaf1}.statement label{margin-right:14px}.review{border:2px solid #deedf7;border-radius:15px;padding:14px;margin:12px 0;text-align:left}.correct{background:#e7f9ed}.wrong{background:#ffe8e8}.score{font-size:68px;font-weight:1000;color:var(--b)}.center{text-align:center}.rub{background:#fff7d9;padding:12px;border-radius:12px;margin-top:10px}.small{font-size:13px;opacity:.78}@media(max-width:620px){.student,.match{grid-template-columns:1fr}.box{padding:15px}.actions button{flex:1}}
</style></head><body><div class="w">
<div class="box hero"><span class="tag">GRADE 5 • CHRISTIAN EDUCATION</span><h1><span class="orange">HAMARTIA!</span> × <span class="blue">THE OLD ME</span></h1><h3>Mixed Interactive Review • C2–C6 🎯📖✨</h3></div>
<div id="start" class="box center"><h2>Ready for the Challenge?</h2><p>30 soal campuran • PG • PG Kompleks • Pernyataan • Matching • Short Answer • Essay</p><div class="student"><input id="nm" placeholder="Nama siswa"><input id="cl" placeholder="Kelas, contoh: 5A"></div><div class="actions" style="justify-content:center"><button onclick="start()">Mulai Latihan 🚀</button></div></div>
<div id="quiz" class="box hidden"><div class="top"><b id="count"></b><div class="prog"><div id="bar"></div></div><b>⭐ <span id="live">0</span></b></div><div style="margin-top:15px"><span id="kind" class="type"></span> <span id="bloom" class="type"></span></div><div id="area"></div><div class="actions"><button id="prev" class="secondary" onclick="go(-1)">← Previous</button><button id="next" onclick="go(1)">Next →</button><button id="finish" class="green hidden" onclick="finish()">Selesai & Lihat Nilai ✓</button></div></div>
<div id="result" class="box hidden center"><h1>🏆 Review Selesai!</h1><h2 id="who"></h2><div id="final" class="score"></div><h2 id="status"></h2><p id="desc"></p><div id="reviews"></div><button onclick="location.reload()">Coba Lagi 🔄</button></div>
</div><script>
const Q=[
{t:"mc",b:"C2",q:"Istilah Hamartia dalam materi berarti ...",o:["missing the target","menjadi sempurna","melakukan kesalahan kecil saja","hukuman kedua"],a:0},
{t:"match",b:"C2",q:"Jodohkan referensi Alkitab dengan pokok materinya.",pairs:[["Kejadian 3","Masuknya dosa melalui pilihan Adam dan Hawa"],["Yohanes 8:1–11","Perempuan yang kedapatan berbuat dosa"],["Kejadian 4","Kain dan Habel"]]},
{t:"multi",b:"C3",q:"Manakah DUA contoh yang termasuk OFF TARGET berdasarkan contoh dalam materi Hamartia?",o:["Menyontek saat ujian","Menolong teman","Berbohong","Membuang sampah pada tempatnya"],a:[0,2]},
{t:"tf",b:"C3",q:"Tentukan BENAR atau SALAH untuk setiap pernyataan.",s:[["Dosa dapat berkaitan dengan pikiran dan motivasi hati.",true],["Hamartia berarti manusia selalu tepat mengenai target Allah.",false],["Iri hati termasuk contoh masalah yang dapat muncul dalam hati.",true]]},
{t:"mc",b:"C3",q:"Dalam Kejadian 3, setelah ular berbicara dan Hawa mendengarkan, langkah berikutnya yang ditunjukkan materi adalah ...",o:["Hawa langsung meninggalkan taman","Hawa melihat buah","Adam menolak buah","ular meminta maaf"],a:1},
{t:"multi",b:"C3",q:"Pilih DUA pernyataan yang sesuai dengan proses godaan dalam materi.",o:["Yang salah dapat dibuat tampak benar","Hati dapat mulai menginginkan yang salah","Godaan selalu langsung dimulai dengan tindakan","Pikiran tidak berpengaruh pada pilihan"],a:[0,1]},
{t:"mc",b:"C2",q:"Menurut Roma 3:23 yang digunakan dalam The Old Me, manusia ...",o:["semua telah berbuat dosa","dapat menghapus dosa sendiri","tidak membutuhkan Allah","hanya berdosa melalui tindakan"],a:0},
{t:"match",b:"C3",q:"Jodohkan konsep dengan penjelasan yang tepat.",pairs:[["Mati secara roh","Terputus hubungan dengan Allah"],["Kematian kedua","Mati kekal / terpisah dari Allah selamanya"],["Standar kesucian Allah","Perbuatan baik manusia tidak dapat menghapus dosa"]]},
{t:"tf",b:"C4",q:"Analisis pernyataan berikut.",s:[["Kisah Kain dan Habel menunjukkan dosa dapat berkembang dari hati menjadi tindakan.",true],["Perbuatan baik manusia otomatis menghapus dosa.",false],["The Old Me mengajarkan manusia perlu menyadari keberdosaannya.",true],["Kesombongan digambarkan sebagai sikap yang perlu dipertahankan.",false]]},
{t:"mc",b:"C4",q:"Kain iri kepada Habel lalu melakukan kejahatan. Kesimpulan yang PALING sesuai materi adalah ...",o:["Dosa hanya ada ketika tindakan sudah terjadi","Isi hati tidak berkaitan dengan tindakan","Dosa yang tidak dikendalikan dapat berkembang dan merusak","Iri hati selalu tidak berbahaya"],a:2},
{t:"multi",b:"C4",q:"Seorang siswa berpikir, “Aku akan berbohong supaya tidak dihukum.” Pilih DUA analisis yang paling sesuai.",o:["Masalah sudah melibatkan pikiran/motivasi hati","Berbohong dapat menjadi tindakan lanjutan dari pilihan salah","Belum ada masalah apa pun karena belum berbicara","Niat tidak berkaitan dengan dosa dalam materi"],a:[0,1]},
{t:"mc",b:"C2",q:"Ayat hafalan dalam materi Hamartia adalah Roma 6:23. Bagian awal ayat tersebut mengajarkan bahwa ...",o:["upah dosa ialah maut","semua manusia tidak berdosa","manusia dapat menyelamatkan diri","dosa tidak memiliki akibat"],a:0},
{t:"tf",b:"C4",q:"Nilai hubungan antara dua materi berikut.",s:[["Hamartia menjelaskan dosa sebagai meleset dari target Allah.",true],["The Old Me menekankan bahwa manusia berdosa membutuhkan Tuhan.",true],["Kedua materi mengajarkan manusia cukup mengandalkan dirinya sendiri.",false]]},
{t:"match",b:"C3",q:"Jodohkan tahap godaan dengan penjelasannya.",pairs:[["Twists God's Words","Yang salah dibuat tampak benar"],["Influences Our Thinking","Pikiran mulai menerima yang salah"],["Affects Our Heart","Hati mulai menginginkan"],["Moves Us to Act","Memilih melakukan tindakan salah"]]},
{t:"mc",b:"C4",q:"Teman mengajak menyontek dan berkata, “Tidak akan ketahuan.” Tahap proses godaan yang paling jelas pada kalimat itu adalah ...",o:["mempengaruhi cara berpikir agar salah terlihat benar","kematian kedua","mati secara roh","kerendahan hati"],a:0},
{t:"multi",b:"C4",q:"Pilih DUA respons yang paling sesuai ketika teman mengajak berbohong.",o:["Menolak berbohong","Memilih berkata benar","Ikut agar tetap diterima teman","Berbohong lalu menyalahkan orang lain"],a:[0,1]},
{t:"mc",b:"C4",q:"Mengapa contoh telur busuk dalam adonan digunakan pada materi The Old Me?",o:["Untuk mengajarkan cara memasak","Untuk menunjukkan sedikit dosa tetap merusak di hadapan Allah yang Mahakudus","Untuk membuktikan makanan selalu berdosa","Untuk menjelaskan iri hati Kain"],a:1},
{t:"tf",b:"C4",q:"Tentukan ketepatan analisis berikut.",s:[["Membenci dan merencanakan kejahatan menunjukkan dosa dapat berada dalam pikiran/hati.",true],["Hanya tindakan yang terlihat yang penting bagi Allah.",false],["Kesadaran akan dosa seharusnya membawa manusia pada kerendahan hati.",true]]},
{t:"match",b:"C4",q:"Jodohkan situasi dengan konsep yang paling tepat.",pairs:[["Aku bisa sendiri dan tidak membutuhkan Tuhan","Kesombongan"],["Aku iri lalu mulai membenci teman","Dosa dalam hati"],["Aku mengakui bahwa aku membutuhkan Tuhan","Kerendahan hati"]]},
{t:"multi",b:"C4",q:"Dalam Yohanes 8:1–11, pilih DUA pelajaran yang sesuai dengan materi.",o:["Tidak ada seorang pun manusia yang tidak berdosa","Belajar tidak menghakimi tetapi mengandalkan kasih dan pengampunan Tuhan","Orang yang berbuat salah harus selalu dilempari batu","Sebagian manusia sama sekali tidak membutuhkan kasih karunia"],a:[0,1]},
{t:"mc",b:"C5",q:"Seorang anak iri ketika temannya dipuji. Tindakan pencegahan PALING tepat berdasarkan Kain–Habel adalah ...",o:["Membiarkan iri sampai hilang sendiri","Menyadari isi hati dan memilih respons yang benar sebelum berkembang menjadi tindakan jahat","Menyebarkan kekurangan temannya","Menghindari semua teman"],a:1},
{t:"multi",b:"C5",q:"Seorang siswa berkata, “Aku salah, tetapi aku bisa memperbaiki semuanya sendiri tanpa Tuhan.” Pilih DUA evaluasi yang sesuai materi.",o:["Pernyataan itu masih menunjukkan sikap mengandalkan diri","Materi menekankan manusia membutuhkan kasih dan anugerah Allah","Pernyataan itu sepenuhnya menunjukkan kerendahan hati","Perbuatan baik pasti menghapus dosa"],a:[0,1]},
{t:"tf",b:"C5",q:"Evaluasi keputusan berikut.",s:[["Menolak menyontek walaupun teman mengejek adalah contoh memilih jalan yang benar.",true],["Berbohong boleh dilakukan jika tujuannya menghindari hukuman.",false],["Mengakui kesalahan dapat mencerminkan kerendahan hati.",true]]},
{t:"match",b:"C4",q:"Jodohkan ayat dengan ide yang ditekankan dalam materi.",pairs:[["Roma 3:23","Semua orang telah berbuat dosa"],["Roma 6:23","Upah dosa ialah maut"],["Habakuk 1:13a","Allah terlalu suci untuk melihat kejahatan"],["Wahyu 20:6","Kematian kedua"]]},
{t:"short",b:"C5",q:"Rina diajak menyontek dan mulai berpikir, “Cuma sekali, tidak apa-apa.” Jelaskan mengapa pikiran itu berbahaya berdasarkan proses godaan dalam materi Hamartia.",model:"Pikiran tersebut berbahaya karena godaan dapat membuat yang salah tampak benar. Jika diterima, pikiran dapat memengaruhi hati/keinginan lalu mendorong pilihan atau tindakan yang salah."},
{t:"short",b:"C5",q:"Jelaskan hubungan antara iri hati Kain dan tindakan yang kemudian dilakukannya. Apa pelajaran yang dapat diterapkan siswa?",model:"Iri hati muncul dalam hati Kain dan berkembang menjadi tindakan jahat. Pelajarannya, siswa perlu mengenali dan menangani sikap hati yang salah sebelum berkembang menjadi tindakan yang merusak."},
{t:"multi",b:"C5",q:"Pilih DUA alasan mengapa kerendahan hati penting setelah seseorang menyadari keberdosaannya.",o:["Menyadari manusia membutuhkan Tuhan","Menyadari manusia tidak dapat mengandalkan dirinya sebagai penyelamat","Supaya terlihat lebih baik daripada orang lain","Supaya bebas menghakimi orang lain"],a:[0,1]},
{t:"essay",b:"C6",q:"CASE STUDY — Temanmu mengajak menyontek dan berkata, “Semua orang melakukannya.” Analisis proses godaan yang mungkin terjadi dari pikiran → hati → tindakan. Kemudian buat respons yang seharusnya kamu lakukan berdasarkan Hamartia dan The Old Me.",rub:["Menjelaskan pengaruh terhadap pikiran","Menjelaskan hati/keinginan","Menjelaskan kemungkinan tindakan","Menghubungkan dengan Hamartia / target Allah","Membuat respons konkret yang sesuai"]},
{t:"essay",b:"C6",q:"CREATE — Buat rencana 3 langkah untuk seorang anak yang sering iri dan membicarakan keburukan temannya. Gunakan pelajaran Kain–Habel, kerendahan hati, dan kebutuhan manusia akan Tuhan.",rub:["Mengidentifikasi iri hati sebagai masalah hati","Menghubungkan hati dengan tindakan","Memakai pelajaran Kain–Habel","Membuat 3 langkah konkret","Menunjukkan kerendahan hati / kebutuhan akan Tuhan"]},
{t:"essay",b:"C6",q:"REFLECTION — Tulis 4–6 kalimat bertema “From My Old Me to God’s Way”. Sebutkan satu sikap yang perlu diubah, jelaskan mengapa sikap itu meleset dari target Allah, dan buat tindakan baru yang akan kamu pilih.",rub:["Sikap lama disebutkan jelas","Menjelaskan kaitan dengan Hamartia","Menunjukkan pemahaman The Old Me","Tindakan baru konkret","Menunjukkan kerendahan hati"]}
];
let i=0,ans=Array(Q.length).fill(null),student={};
const $=x=>document.getElementById(x);
function start(){if(!$("nm").value.trim()||!$("cl").value.trim()){alert("Isi nama dan kelas terlebih dahulu 😊");return}student={n:$("nm").value.trim(),c:$("cl").value.trim()};$("start").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function save(){let q=Q[i];if(q.t==="mc"){let x=document.querySelector('input[name=mc]:checked');ans[i]=x?+x.value:null}
if(q.t==="multi")ans[i]=[...document.querySelectorAll('input[name=multi]:checked')].map(x=>+x.value);
if(q.t==="tf")ans[i]=q.s.map((_,k)=>{let x=document.querySelector(`input[name=tf${k}]:checked`);return x?x.value==="true":null});
if(q.t==="match")ans[i]=q.pairs.map((_,k)=>$("m"+k).value);
if(q.t==="short"||q.t==="essay")ans[i]=$("text").value.trim()}
function render(){let q=Q[i];$("count").textContent=`Soal ${i+1} dari ${Q.length}`;$("bar").style.width=`${(i+1)/Q.length*100}%`;$("kind").textContent=({mc:"Pilihan Ganda",multi:"PG Kompleks • Pilih 2",tf:"Pernyataan Benar/Salah",match:"Matching",short:"Isian Singkat",essay:"Essay"}[q.t]);$("bloom").textContent=q.b;$("prev").disabled=i===0;$("next").classList.toggle("hidden",i===Q.length-1);$("finish").classList.toggle("hidden",i!==Q.length-1);let h=`<div class="q">${i+1}. ${q.q}</div>`;
if(q.t==="mc")h+=`<div class="opts">${q.o.map((o,k)=>`<label class="opt"><input type="radio" name="mc" value="${k}" ${ans[i]===k?"checked":""}><b>${"ABCD"[k]}.</b> ${o}</label>`).join("")}</div>`;
if(q.t==="multi")h+=`<div class="hint">☑️ Pilih tepat <b>2 jawaban</b>.</div><div class="opts">${q.o.map((o,k)=>`<label class="opt"><input type="checkbox" name="multi" value="${k}" ${(ans[i]||[]).includes(k)?"checked":""}><b>${"ABCD"[k]}.</b> ${o}</label>`).join("")}</div>`;
if(q.t==="tf")h+=q.s.map((s,k)=>`<div class="statement"><b>${k+1}.</b> ${s[0]}<br><label><input type="radio" name="tf${k}" value="true" ${ans[i]&&ans[i][k]===true?"checked":""}> BENAR</label><label><input type="radio" name="tf${k}" value="false" ${ans[i]&&ans[i][k]===false?"checked":""}> SALAH</label></div>`).join("");
if(q.t==="match"){let rights=q.pairs.map(x=>x[1]).sort(()=>Math.random()-.5);h+=`<div class="hint">🔗 Pilih pasangan yang tepat untuk setiap bagian kiri.</div><div class="match">${q.pairs.map((p,k)=>`<div class="mrow"><b>${p[0]}</b><select id="m${k}"><option value="">— Pilih pasangan —</option>${rights.map(r=>`<option ${ans[i]&&ans[i][k]===r?"selected":""}>${r}</option>`).join("")}</select></div>`).join("")}</div>`}
if(q.t==="short")h+=`<div class="hint">🧠 Jawab dengan 2–4 kalimat. Jawaban akan ditampilkan bersama jawaban acuan saat review.</div><textarea id="text" placeholder="Tuliskan jawabanmu...">${ans[i]||""}</textarea>`;
if(q.t==="essay")h+=`<div class="hint">✍️ Jawaban C6 dinilai guru menggunakan rubrik setelah latihan selesai.</div><textarea id="text" placeholder="Tuliskan jawaban lengkapmu...">${ans[i]||""}</textarea>`;
$("area").innerHTML=h}
function go(d){save();i+=d;render()}
function objectiveCorrect(q,a){if(a==null)return false;if(q.t==="mc")return a===q.a;if(q.t==="multi")return JSON.stringify([...a].sort())===JSON.stringify([...q.a].sort());if(q.t==="tf")return a.length===q.s.length&&a.every((v,k)=>v===q.s[k][1]);if(q.t==="match")return a.length===q.pairs.length&&a.every((v,k)=>v===q.pairs[k][1]);return null}
function finish(){save();let unanswered=ans.map((a,k)=>a==null||(Array.isArray(a)&&a.some(x=>x==null))||a===""?k+1:null).filter(Boolean);if(unanswered.length&&!confirm("Masih ada jawaban kosong pada soal: "+unanswered.join(", ")+". Tetap selesai?"))return;
let objIdx=Q.map((q,k)=>["mc","multi","tf","match"].includes(q.t)?k:null).filter(x=>x!==null), correct=objIdx.filter(k=>objectiveCorrect(Q[k],ans[k])).length;let auto=Math.round(correct/objIdx.length*100);
$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("who").textContent=student.n+" • "+student.c;$("final").textContent=auto;$("status").textContent=auto>=70?"✅ TUNTAS (Objektif)":"📘 BELUM TUNTAS (Objektif)";$("desc").textContent=`Skor otomatis: ${correct}/${objIdx.length} soal objektif benar. Isian singkat dan essay tidak dimasukkan ke skor otomatis agar penilaian C5–C6 tetap adil.`;
let out="<h2>📋 Review Jawaban</h2>";Q.forEach((q,k)=>{let oc=objectiveCorrect(q,ans[k]),cls=oc===true?"correct":oc===false?"wrong":"";out+=`<div class="review ${cls}"><b>Soal ${k+1} • ${q.b} • ${$("kind")?({mc:"PG",multi:"PG Kompleks",tf:"Pernyataan",match:"Matching",short:"Isian Singkat",essay:"Essay"}[q.t]):q.t}</b><p>${q.q}</p>`;
if(q.t==="mc")out+=`Jawabanmu: <b>${ans[k]!=null?q.o[ans[k]]:"—"}</b><br>Kunci: <b>${q.o[q.a]}</b>`;
if(q.t==="multi")out+=`Jawabanmu: <b>${(ans[k]||[]).map(x=>q.o[x]).join("; ")||"—"}</b><br>Kunci: <b>${q.a.map(x=>q.o[x]).join("; ")}</b>`;
if(q.t==="tf")out+=`Jawabanmu: <b>${(ans[k]||[]).map(x=>x===true?"Benar":x===false?"Salah":"—").join(" • ")}</b><br>Kunci: <b>${q.s.map(x=>x[1]?"Benar":"Salah").join(" • ")}</b>`;
if(q.t==="match")out+=`<b>Kunci pasangan:</b><br>${q.pairs.map(x=>x[0]+" → "+x[1]).join("<br>")}`;
if(q.t==="short")out+=`<b>Jawabanmu:</b><p>${ans[k]||"—"}</p><div class="rub"><b>Jawaban acuan:</b> ${q.model}</div>`;
if(q.t==="essay")out+=`<b>Jawabanmu:</b><p>${ans[k]||"—"}</p><div class="rub"><b>Rubrik guru:</b><br>${q.rub.map(x=>"☐ "+x).join("<br>")}</div>`;out+="</div>"});$("reviews").innerHTML=out}
render();
</script></body></html>
