<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e9f6ff,#fff8cf);color:#183153}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d6e4f0;border-radius:22px;padding:24px;box-shadow:0 12px 30px #1232  }.hero{text-align:center}h1{font-size:clamp(28px,5vw,46px);margin:.3em}.sub{color:#5c7290}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.full{grid-column:1/-1}label.field{display:flex;flex-direction:column;gap:6px}input[type=text]{padding:13px;border:1px solid #bfd2e5;border-radius:12px;font-size:16px}.toggle{padding:11px;background:#f4f9ff;border-radius:12px}.btns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:bold;cursor:pointer;background:#e8f1ff;color:#174b9a}.primary{background:#2563eb;color:white}.green{background:#168a52;color:white}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px}.pill{background:#fff0a8;padding:7px 11px;border-radius:99px;font-weight:bold}.bar{height:12px;background:#e7edf4;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar div{height:100%;background:linear-gradient(90deg,#48a6ff,#4ac17c)}.opts{display:grid;gap:11px;margin:20px 0}.opt{display:flex;gap:12px;padding:14px;border:1px solid #d7e3ee;border-radius:14px}.opt input{transform:scale(1.25)}.result{text-align:center}.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:18px auto;background:conic-gradient(#28a163 var(--p),#e8edf3 0);position:relative}.ring:after{content:"";position:absolute;width:116px;height:116px;background:#fff;border-radius:50%}.ring span{z-index:1;font-size:34px;font-weight:bold}.reviewItem{padding:15px;border-radius:14px;margin:10px 0;border:1px solid #d7e3ee}.good{background:#edfaf2}.partial{background:#fff8d9}.wrong{background:#fff0f0}.small{font-size:14px;color:#657a91}.warn{color:#a22}.icons{font-size:34px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:10px}.card{padding:17px}.btn{flex:1}}</style></head><body><main class="wrap">

<script>const MASTER=[{"id": 1, "q": "Istilah Hamartia berasal dari bahasa Yunani yang digunakan Alkitab untuk menjelaskan konsep dosa. Manakah pemahaman yang BENAR mengenai Hamartia?", "options": [{"id": "A", "text": "Arti dasarnya adalah meleset dari sasaran/target"}, {"id": "B", "text": "Menggambarkan anak panah yang memanah tepat di titik pusat"}, {"id": "C", "text": "Kegagalan manusia memenuhi standar kebenaran Allah"}, {"id": "D", "text": "Tindakan yang selalu menyenangkan hati Allah"}], "correct": ["A", "C"]}, {"id": 2, "q": "Berdasarkan Kejadian 2:16-17, aturan apakah yang berikan Allah kepada manusia saat berada di Taman Eden?", "options": [{"id": "A", "text": "Boleh makan buah dari semua pohon secara bebas"}, {"id": "B", "text": "Pohon pengetahuan tentang yang baik dan jahat tidak boleh dimakan"}, {"id": "C", "text": "Manusia tidak boleh memakan buah apapun di Taman Eden"}, {"id": "D", "text": "Melanggar larangan Allah akan mengakibatkan kematian"}], "correct": ["A", "B", "D"]}, {"id": 3, "q": "Berdasarkan firman Tuhan di Roma 3:10 dan Roma 3:23, bagaimanakah kondisi seluruh manusia di hadapan Allah?", "options": [{"id": "A", "text": "Tidak ada yang benar di bumi, seorang pun tidak"}, {"id": "B", "text": "Ada sebagian manusia yang tidak pernah berbuat dosa"}, {"id": "C", "text": "Semua orang telah berbuat dosa dan kehilangan kemuliaan Allah"}, {"id": "D", "text": "Semua manusia secara alami memiliki kesucian yang sempurna"}], "correct": ["A", "C"]}, {"id": 4, "q": "Dalam kisah Kain dan Habel (Kejadian 4), bagaimanakah perkembangan dosa yang terjadi dalam diri Kain?", "options": [{"id": "A", "text": "Diawali rasa iri hati karena persembahannya tidak diindahkan"}, {"id": "B", "text": "Kain menguasai emosinya dan mendengarkan teguran Tuhan"}, {"id": "C", "text": "Dosa mengintip di depan pintu dan Kain membiarkannya"}, {"id": "D", "text": "Berujung pada tindakan pembunuhan terhadap Habel"}], "correct": ["A", "C", "D"]}, {"id": 5, "q": "Analogi adonan kue yang dicampur sebutir telur busuk mengajarkan kebenaran rohani yaitu...", "options": [{"id": "A", "text": "Sedikit dosa saja sudah mengotori seluruh kehidupan manusia"}, {"id": "B", "text": "Dosa kecil tidak akan berdampak pada kebersihan rohani kita"}, {"id": "C", "text": "Kebaikan yang banyak dapat menutupi dosa kecil yang dilakukan"}, {"id": "D", "text": "Dosa merusak seluruh natur dan pikiran manusia di hadapan Allah"}], "correct": ["A", "D"]}, {"id": 6, "q": "Kondisi 'Mati Secara Roh' merupakan dampak kejatuhan manusia. Manakah ciri-ciri seseorang yang mati secara roh?", "options": [{"id": "A", "text": "Hubungan pribadinya terputus dari Allah sumber kehidupan"}, {"id": "B", "text": "Jantung fisiknya langsung berhenti berdetak saat itu juga"}, {"id": "C", "text": "Tidak memiliki kerinduan untuk hidup sesuai firman Tuhan"}, {"id": "D", "text": "Mengalami kegelapan rohani dan kehilangan persekutuan dengan Allah"}], "correct": ["A", "C", "D"]}, {"id": 7, "q": "Berdasarkan Roma 6:23, apakah ajaran utama Alkitab mengenai upah dosa dan kasih karunia Allah?", "options": [{"id": "A", "text": "Upah dari kehidupan berdosa adalah maut"}, {"id": "B", "text": "Karunia Allah ialah hidup kekal dalam Kristus Yesus"}, {"id": "C", "text": "Manusia dapat membeli hidup kekal dengan uang dan amal"}, {"id": "D", "text": "Maut adalah hadiah yang diberikan Allah bagi orang benar"}], "correct": ["A", "B"]}, {"id": 8, "q": "Habakuk 1:13a menyatakan mata Allah terlalu suci untuk melihat kejahatan. Manakah pernyataan yang BENAR?", "options": [{"id": "A", "text": "Menegaskan kesucian Allah yang mutlak"}, {"id": "B", "text": "Allah dapat bertoleransi dengan dosa kecil manusia"}, {"id": "C", "text": "Kebijakan Allah kompromi terhadap pelanggaran firman"}, {"id": "D", "text": "Dosa memisahkan manusia secara total dari Allah yang kudus"}], "correct": ["A", "D"]}, {"id": 9, "q": "Materi How Does Satan Tempt Us menjelaskan strategi Iblis saat menggoda manusia. Apakah tahapan tersebut?", "options": [{"id": "A", "text": "He Twists God's Words: Memutarbalikkan perintah firman Allah"}, {"id": "B", "text": "He Lies: Menyampaikan kebohongan dan menipu manusia"}, {"id": "C", "text": "He Helps: Membantu manusia mendekatkan diri kepada Allah"}, {"id": "D", "text": "He Destroys: Bertujuan merusak hubungan manusia dengan Tuhan"}], "correct": ["A", "B", "D"]}, {"id": 10, "q": "Proses kejatuhan Hawa di Kejadian 3 berlangsung runtut. Manakah di antara langkah berikut yang TERMASUK?", "options": [{"id": "A", "text": "Eve Listens: Hawa memberi telinga mendengarkan godaan ular"}, {"id": "B", "text": "Eve Touches & Eats: Hawa mengambil dan memakan buah tersebut"}, {"id": "C", "text": "Eve Runs Away: Hawa langsung berlari menjauhi godaan ular"}, {"id": "D", "text": "Eve Gives to Adam: Hawa memberi buah itu kepada suaminya"}], "correct": ["A", "B", "D"]}, {"id": 11, "q": "Yesus mengajarkan dosa tidak hanya perbuatan fisik, tetapi juga pikiran. Manakah contoh Dosa Pikiran?", "options": [{"id": "A", "text": "Membayangkan cara jahat untuk menjahili teman hingga menangis"}, {"id": "B", "text": "Menyimpan rasa benci dan dendam secara rahasia di dalam hati"}, {"id": "C", "text": "Mendoakan teman yang sedang mengalami kesulitan belajar"}, {"id": "D", "text": "Menginginkan milik orang lain dengan rasa iri hati (serakah)"}], "correct": ["A", "B", "D"]}, {"id": 12, "q": "Berdasarkan penjelasan materi Deep Thinking, manakah sikap di bawah ini yang tergolong sebagai dosa?", "options": [{"id": "A", "text": "Angry: Marah tak terkendali dan melukai sesama dengan kata-kata"}, {"id": "B", "text": "Ignoring: Sengaja cuek dan tidak peduli pada orang yang membutuhkan"}, {"id": "C", "text": "Cheating: Berbuat curang saat mengerjakan tes atau ujian"}, {"id": "D", "text": "Sharing: Membagi makanan secara adil kepada teman yang lapar"}], "correct": ["A", "B", "C"]}, {"id": 13, "q": "Manusia berdosa memiliki sifat sombong (Pride). Ungkapan manakah yang mencerminkan kesombongan?", "options": [{"id": "A", "text": "Aku pasti bisa hebat sendiri tanpa perlu bantuan siapapun!"}, {"id": "B", "text": "Keberhasilanku ini semata-mata karena pertolongan dan kasih Tuhan."}, {"id": "C", "text": "Pikiran dan pendapatku selalu paling benar dibanding orang lain."}, {"id": "D", "text": "Mari kita berdoa meminta hikmat Tuhan sebelum mengerjakan tugas."}], "correct": ["A", "C"]}, {"id": 14, "q": "Kerendahan Hati (Modesty) adalah karakter Kristiani. Tindakan manakah yang mencerminkan kerendahan hati?", "options": [{"id": "A", "text": "Mengakui secara jujur kelemahan dan dosa di hadapan Allah"}, {"id": "B", "text": "Mau mendengarkan nasihat dan teguran yang membangun"}, {"id": "C", "text": "Memamerkan semua prestasi di media sosial agar dipuji orang"}, {"id": "D", "text": "Menganggap teman lain lebih rendah kemampuannya dibanding kita"}], "correct": ["A", "B"]}, {"id": 15, "q": "Alkitab mengajarkan doktrin 'Bibit Dosa' pada manusia. Kenyataan manakah yang BENAR mengenai bibit dosa?", "options": [{"id": "A", "text": "Setiap manusia melahirkan keturunan yang mewarisi kecenderungan berdosa"}, {"id": "B", "text": "Bayi yang baru lahir sudah bersih 100% dari kecenderungan dosa Adam"}, {"id": "C", "text": "Kecenderungan berbuat jahat muncul secara alami dalam diri manusia"}, {"id": "D", "text": "Manusia perlu kelahiran baru di dalam Kristus untuk diubahkan"}], "correct": ["A", "C", "D"]}, {"id": 16, "q": "Kita dipanggil memilih jalan Tuhan setiap hari (Choose God's Way Every Day). Manakah tindakan yang sesuai?", "options": [{"id": "A", "text": "Tell the truth: Selalu berani berkata jujur walau dalam kondisi sulit"}, {"id": "B", "text": "Obey Parents: Mengatur waktu dan taat kepada orang tua dengan suka cita"}, {"id": "C", "text": "Be Greedy: Mengambil porsi makanan terbanyak tanpa peduli adik"}, {"id": "D", "text": "Forgive others: Mau memaafkan teman yang memohon maaf"}], "correct": ["A", "B", "D"]}, {"id": 17, "q": "Dalam kisah perempuan berbuat dosa (Yohanes 8:1-11), apakah pelajaran penting yang Yesus sampaikan?", "options": [{"id": "A", "text": "Orang Farisi memakai perempuan itu untuk menjebak Yesus"}, {"id": "B", "text": "Yesus menyuruh warga langsung melempari batu tanpa ampun"}, {"id": "C", "text": "Barangsiapa di antara kamu tidak berdosa, hendaklah ia pertama melemparkan batu"}, {"id": "D", "text": "Yesus mengampuni dan menasihati agar tidak berbuat dosa lagi"}], "correct": ["A", "C", "D"]}, {"id": 18, "q": "Wahyu 20:6 menyebutkan istilah 'Kematian Kedua'. Kebenaran apakah yang Alkitab nyatakan tentang kematian kedua?", "options": [{"id": "A", "text": "Kematian kedua adalah hukuman kekal terpisah dari Allah di neraka"}, {"id": "B", "text": "Kematian kedua adalah kematian fisik saat manusia sudah lanjut usia"}, {"id": "C", "text": "Orang yang menang dan setia dalam Kristus tidak dikuasai kematian kedua"}, {"id": "D", "text": "Kematian kedua terjadi pada semua orang tanpa terkecuali"}], "correct": ["A", "C"]}, {"id": 19, "q": "Dalam situasi What Would You Do? di sekolah, tindakan manakah yang menunjukkan pilihan hidup menurut jalan Tuhan?", "options": [{"id": "A", "text": "Menolak dengan tegas ketika diajak teman mencontek saat tes"}, {"id": "B", "text": "Mengembalikan barang milik teman yang tertinggal di atas meja kelas"}, {"id": "C", "text": "Pura-pura tidak tahu saat melihat teman dijahili sampai menangis"}, {"id": "D", "text": "Mengajak teman berdoa sebelum memulai ulangan harian"}], "correct": ["A", "B", "D"]}, {"id": 20, "q": "Yosua 24:15 memuat komitmen penting keluarga orang percaya. Pernyataan manakah yang BENAR sesuai ayat tersebut?", "options": [{"id": "A", "text": "Berisi tegas: Aku dan sekeluargaku, kami akan beribadah kepada TUHAN!"}, {"id": "B", "text": "Yosua membebaskan bangsa Israel memilih allah lain jika mereka mau"}, {"id": "C", "text": "Komitmen ini menunjukkan keteguhan hati mengikut Tuhan secara penuh"}, {"id": "D", "text": "Yosua memaksa bangsa lain beribadah tanpa pilihan bebas"}], "correct": ["A", "C"]}, {"id": 21, "q": "Bagaimanakah keterbatasan amal dan perbuatan baik manusia dijelaskan di dalam Alkitab?", "options": [{"id": "A", "text": "Perbuatan baik tidak bisa membayar hutang dosa di hadapan Allah"}, {"id": "B", "text": "Kebijakan amal manusia seperti kain kotor di hadapan Allah yang kudus"}, {"id": "C", "text": "Semakin banyak amal, secara otomatis manusia pasti masuk surga"}, {"id": "D", "text": "Keselamatan hanya diperoleh melalui anugerah Allah di dalam Kristus"}], "correct": ["A", "B", "D"]}, {"id": 22, "q": "Meskipun manusia jatuh ke dalam dosa, Allah tetap menunjukkan kasih-Nya. Manakah bentuk kasih Allah tersebut?", "options": [{"id": "A", "text": "Allah menyediakan jalan pengampunan melalui pengorbanan Yesus"}, {"id": "B", "text": "Allah langsung memusnahkan Adam dan Hawa tanpa memberi janji keselamatan"}, {"id": "C", "text": "Allah membuatkan pakaian dari kulit binatang untuk menutupi ketelanjangan mereka"}, {"id": "D", "text": "Allah memberikan janji keselamatan sejak di Kejadian 3:15"}], "correct": ["A", "C", "D"]}, {"id": 23, "q": "Tujuan pembelajaran HEAD, HEART, HAND mengajarkan perubahan hidup utuh. Pasangan manakah yang BENAR?", "options": [{"id": "A", "text": "HEAD: Menyadari dan memahami bahwa seluruh manusia telah berdosa"}, {"id": "B", "text": "HEART: Merasakan penyesalan mendalam dan kerinduan untuk diampuni"}, {"id": "C", "text": "HAND: Melakukan tindakan nyata yang mencerminkan pertobatan setiap hari"}, {"id": "D", "text": "HEAD: Melatih otot tangan agar kuat bekerja keras di ladang"}], "correct": ["A", "B", "C"]}, {"id": 24, "q": "Ular di Taman Eden menggunakan kebohongan untuk menjatuhkan manusia. Manakah bentuk kebohongan tersebut?", "options": [{"id": "A", "text": "Mengatakan bahwa manusia 'sekali-kali tidak akan mati'"}, {"id": "B", "text": "Menyatakan bahwa mata mereka akan terbuka dan menjadi seperti Allah"}, {"id": "C", "text": "Menyuruh manusia selalu taat dan menghormati firman Allah"}, {"id": "D", "text": "Menimbulkan keraguan akan kebaikan dan kebenaran perintah Allah"}], "correct": ["A", "B", "D"]}, {"id": 25, "q": "Manakah sikap mendasar yang membedakan antara 'Diriku yang Dulu' (The Old Me) dan 'Diriku yang Baru' (The New Me)?", "options": [{"id": "A", "text": "The Old Me hidup dalam kesombongan; The New Me dalam kerendahan hati"}, {"id": "B", "text": "The Old Me suka berbohong; The New Me senantiasa berkata jujur"}, {"id": "C", "text": "The Old Me mendoakan musuh; The New Me membalas dendam"}, {"id": "D", "text": "The Old Me menuruti keinginan dosa; The New Me taat firman Tuhan"}], "correct": ["A", "B", "D"]}, {"id": 26, "q": "Mengapa tindakan mengabaikan (Ignoring) orang yang membutuhkan pertolongan tergolong tindakan dosa?", "options": [{"id": "A", "text": "Tahu melakukan kebaikan tetapi tidak melakukannya adalah dosa (Yakobus 4:17)"}, {"id": "B", "text": "Mengabaikan sesama merupakan bentuk ketiadaan kasih Kristus di dalam diri"}, {"id": "C", "text": "Karena mengabaikan orang lain diperbolehkan selama tidak mencuri"}, {"id": "D", "text": "Menutup mata terhadap penderitaan sesama melanggar hukum kasih"}], "correct": ["A", "B", "D"]}, {"id": 27, "q": "Manakah bukti bahwa Allah tetap mengasihi Adam dan Hawa meskipun mereka telah jatuh ke dalam dosa?", "options": [{"id": "A", "text": "Allah tidak langsung memusnahkan manusia pada detik itu juga"}, {"id": "B", "text": "Allah membuatkan pakaian dari kulit binatang untuk menutupi tubuh mereka"}, {"id": "C", "text": "Allah membiarkan mereka tetap tinggal di dalam Taman Eden selamanya"}, {"id": "D", "text": "Allah memberikan Janji Keselamatan (Induk Injil) di Kejadian 3:15"}], "correct": ["A", "B", "D"]}, {"id": 28, "q": "Dalam konteks kehidupan sekolah, manakah contoh dosa yang sering dipicu oleh rasa iri hati (Jealous)?", "options": [{"id": "A", "text": "Menyebarkan gosip atau rumor jahat tentang teman yang juara kelas"}, {"id": "B", "text": "Merusak barang milik teman karena tidak senang teman memiliki barang bagus"}, {"id": "C", "text": "Mendorong dan memberi selamat atas keberhasilan teman mendapatkan nilai A"}, {"id": "D", "text": "Pura-pura tidak mau berteman karena teman tersebut dipuji guru"}], "correct": ["A", "B", "D"]}, {"id": 29, "q": "Mengapa Alkitab mengajarkan bahwa tidak ada seorang pun manusia bisa masuk surga hanya mengandalkan usahanya?", "options": [{"id": "A", "text": "Karena semua manusia sudah tercemar oleh bibit dosa sejak lahir"}, {"id": "B", "text": "Standar kebenaran Allah itu sempurna dan tidak dapat dicapai manusia"}, {"id": "C", "text": "Karena surga hanya diperuntukkan bagi malaikat, bukan manusia"}, {"id": "D", "text": "Hanya karya penebusan Yesus yang sanggup menyucikan dosa manusia"}], "correct": ["A", "B", "D"]}, {"id": 30, "q": "Sifat kesombongan (Pride) merusak hubungan dengan Tuhan dan sesama. Manakah dampak sifat sombong?", "options": [{"id": "A", "text": "Merasa tidak perlu berdoa atau meminta pertolongan Tuhan saat belajar"}, {"id": "B", "text": "Menolak mendengarkan masukan atau teguran dari orang tua dan guru"}, {"id": "C", "text": "Suka meremehkan dan merendahkan teman yang belum berhasil"}, {"id": "D", "text": "Selalu bersyukur atas setiap pemberian dan karunia yang diterima"}], "correct": ["A", "B", "C"]}, {"id": 31, "q": "Aktivitas harian Mission This Week mendorong tindakan nyata. Manakah yang merupakan perbuatan Tell the Truth?", "options": [{"id": "A", "text": "Jujur kepada orang tua saat tidak sengaja memecahkan piring"}, {"id": "B", "text": "Mengakui kesalahan kepada guru ketika lupa mengerjakan tugas rumah"}, {"id": "C", "text": "Menyalahkan orang lain agar diri sendiri tidak dihukum guru"}, {"id": "D", "text": "Tidak menambah-nambahkan atau mengurangi cerita saat melapor"}], "correct": ["A", "B", "D"]}, {"id": 32, "q": "Apakah yang dimaksud dengan pernyataan bahwa Iblis adalah 'Bapa Segala Dusta' berdasarkan Alkitab?", "options": [{"id": "A", "text": "Iblis adalah sumber dan pencetus awal timbulnya kebohongan di dunia"}, {"id": "B", "text": "Iblis selalu memakai tipu daya untuk menjauhkan manusia dari kebenaran"}, {"id": "C", "text": "Kebohongan Iblis bertujuan membawa manusia pada kebinasaan"}, {"id": "D", "text": "Iblis mengajarkan manusia untuk selalu taat pada firman Tuhan"}], "correct": ["A", "B", "C"]}, {"id": 33, "q": "Bagaimanakah firman Tuhan menjadi penuntun bagi kehidupan kita agar tidak meleset dari sasaran (Hamartia)?", "options": [{"id": "A", "text": "Firman Tuhan memberi petunjuk jelas mengenai standar kebenaran Allah"}, {"id": "B", "text": "Membaca dan melakukan firman menjaga langkah hidup kita tetap murni"}, {"id": "C", "text": "Firman Tuhan menjadi pelita bagi kaki dan terang bagi jalan hidup kita"}, {"id": "D", "text": "Firman Tuhan membebaskan kita untuk berbuat dosa sesuka hati"}], "correct": ["A", "B", "C"]}, {"id": 34, "q": "Sikap Obey Parents (Taat Orang Tua) didasarkan pada prinsip Alkitab. Manakah contoh ketaatan yang benar?", "options": [{"id": "A", "text": "Segera mematikan gawai/gadget ketika diminta ibu untuk belajar"}, {"id": "B", "text": "Mengerjakan tugas rumah yang diperintahkan orang tua tanpa bersungut-sungut"}, {"id": "C", "text": "Pura-pura tidur saat dipanggil orang tua untuk beribadah bersama"}, {"id": "D", "text": "Mendengarkan dan menjalankan nasihat baik orang tua dengan penuh hormat"}], "correct": ["A", "B", "D"]}, {"id": 35, "q": "Apakah hasil akhir yang dijanjikan Tuhan ketika seseorang meninggalkan kehidupan lama (The Old Me) dalam Kristus?", "options": [{"id": "A", "text": "Diampuni dari hukuman dosa dan dipulihkan hubungannya dengan Allah"}, {"id": "B", "text": "Menjadi ciptaan baru yang terus diubah makin serupa dengan Kristus"}, {"id": "C", "text": "Memperoleh jaminan kehidupan kekal bersama Allah di surga"}, {"id": "D", "text": "Bebas dari segala ujian, tantangan, dan masalah di dunia secara instant"}], "correct": ["A", "B", "C"]}];let quiz=[],ans={},i=0,student={},res=null;function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}function start(){let n=document.getElementById("name").value.trim(),k=document.getElementById("kelas").value.trim();if(!n||!k){document.getElementById("warn").textContent="Lengkapi Nama Lengkap dan Kelas terlebih dahulu.";return}student={n,k};ans={};i=0;quiz=MASTER.map(q=>({...q,options:q.options.map(o=>({...o}))}));if(document.getElementById("sq").checked)quiz=sh(quiz);if(document.getElementById("so").checked)quiz.forEach(q=>q.options=sh(q.options));document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");render()}function render(){let q=quiz[i];document.getElementById("count").textContent=`Soal ${i+1} dari ${quiz.length}`;document.getElementById("fill").style.width=((i+1)/quiz.length*100)+"%";document.getElementById("qt").textContent=q.q;let optsEl=document.getElementById("opts");optsEl.innerHTML="";q.options.forEach(o=>{let l=document.createElement("label");l.className="opt";let c=document.createElement("input");c.type="checkbox";c.checked=(ans[q.id]||[]).includes(o.id);c.onchange=()=>{let z=ans[q.id]||[];if(c.checked&&!z.includes(o.id))z.push(o.id);if(!c.checked)z=z.filter(x=>x!==o.id);ans[q.id]=z};let s=document.createElement("span");s.innerHTML="<b>"+o.id+".</b> "+o.text;l.append(c,s);optsEl.append(l)});document.getElementById("prev").disabled=i===0;let last=i===quiz.length-1;document.getElementById("next").classList.toggle("hidden",last);document.getElementById("done").classList.toggle("hidden",!last)}function move(d){i+=d;render();scrollTo(0,0)}function grade(q){let s=ans[q.id]||[],bad=s.some(x=>!q.correct.includes(x)),hit=s.filter(x=>q.correct.includes(x)).length;if(bad||!s.length)return{p:0,t:"Salah"};if(hit===q.correct.length&&s.length===q.correct.length)return{p:2,t:"Benar"};if(hit>=Math.ceil(q.correct.length/2))return{p:1,t:"Sebagian Benar"};return{p:0,t:"Salah"}}function finish(){let p=0,d={};MASTER.forEach(q=>{let g=grade(q);p+=g.p;d[q.id]=g});let max=MASTER.length*2,v=Math.round(p/max*1000)/10;res={p,max,v,d};document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("info").textContent=`${student.n} • Kelas ${student.k}`;document.getElementById("big").textContent=Math.round(v);document.getElementById("ring").style.setProperty("--p",Math.min(v,100)+"%");document.getElementById("status").textContent=v>=70?"TUNTAS 🎉":"BELUM TUNTAS — Tetap semangat dan pelajari kembali materinya! 💪";document.getElementById("summary").textContent=`Skor ${p} dari ${max} • Nilai ${v} • KKM 70`;scrollTo(0,0)}function review(){document.getElementById("result").classList.add("hidden");document.getElementById("review").classList.remove("hidden");document.getElementById("reviewList").innerHTML="";MASTER.forEach(q=>{let g=res.d[q.id],s=ans[q.id]||[],bad=s.filter(x=>!q.correct.includes(x)),d=document.createElement("div");d.className="reviewItem "+(g.t==="Benar"?"good":g.t==="Sebagian Benar"?"partial":"wrong");d.innerHTML=`<b>${q.id}. ${q.q}</b><p>Status: <b>${g.t}</b> (${g.p}/2)</p><p>Jawaban siswa: <b>${s.length?s.join(", "):"Tidak menjawab"}</b><br>Jawaban benar: <b>${q.correct.join(", ")}</b>${bad.length?"<br>Pilihan salah yang dicentang: <b>"+bad.join(", ")+"</b>":""}</p>`;document.getElementById("reviewList").append(d)});scrollTo(0,0)}function back(){document.getElementById("review").classList.add("hidden");document.getElementById("result").classList.remove("hidden");scrollTo(0,0)}</script></body></html>
